<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلبات بوابة المستفيد | إتقان</title><style>body{font-family:system-ui,Tahoma;background:#f1f5f9;color:#0f172a;margin:0;padding:24px}.wrap{max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.card,.settings{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 8px 28px #0f172a0d}.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}button,a{border:0;border-radius:10px;padding:10px 14px;font-weight:700;text-decoration:none;cursor:pointer}.yes{background:#059669;color:#fff}.no{background:#dc2626;color:#fff}.info{background:#4f46e5;color:#fff}.warn{background:#d97706;color:#fff}input{padding:11px;border:1px solid #cbd5e1;border-radius:10px;min-width:280px}.badge{padding:5px 10px;border-radius:999px;font-weight:700}.pending{background:#fef3c7}.approved{background:#d1fae5}.rejected{background:#fee2e2}.needs_info{background:#ffedd5}.id{direction:ltr;display:inline-block;font-weight:800}.ok{color:#047857;font-weight:700}</style></head><body><main class="wrap"><div class="top"><div><h1>طلبات بوابة المستفيد</h1><p>إدارة طلبات المسرح والقاعات وربطها بمسرحنا عبر Supabase</p></div><a class="info" href="index.html">العودة لإتقان</a></div><section class="settings"><b>دخول إدارة الطلبات</b><div class="actions"><input id="adminKey" type="password" placeholder="مفتاح إدارة الطلبات"><button class="info" onclick="saveKey()">حفظ المفتاح</button><button onclick="refresh()">تحديث الطلبات</button></div><small id="apiState">الاتصال: Supabase</small></section><div id="list"></div></main><script src="booking-integration.js"></script><script>
const I=window.ITGAN_BOOKING_INTEGRATION;document.getElementById('adminKey').value=I.getAdminKey();
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function label(s){return({pending:'قيد المراجعة',approved:'معتمد',rejected:'مرفوض',needs_info:'مطلوب معلومات',cancelled:'ملغي'})[s]||s}
function saveKey(){I.setAdminKey(document.getElementById('adminKey').value);refresh()}
async function setStatus(id,status){try{await I.updateRemoteStatus(id,status);render(I.getRequests())}catch(e){alert('تعذر تحديث الطلب: '+e.message)}}
function render(rows){const el=document.getElementById('list');if(!rows.length){el.innerHTML='<section class="card">لا توجد طلبات واردة.</section>';return}el.innerHTML=rows.map(b=>`<article class="card"><div class="top"><h3>${esc(b.eventTitle||'طلب حجز')}</h3><span class="badge ${esc(b.status||'pending')}">${esc(label(b.status||'pending'))}</span></div><div class="meta"><div><b>رقم الطلب</b><br><span class="id">${esc(b.requestId)}</span></div><div><b>الجهة</b><br>${esc(b.orgName||'—')}</div><div><b>المنسق</b><br>${esc(b.contactName||'—')}</div><div><b>الجوال</b><br>${esc(b.phone||'—')}</div><div><b>التاريخ</b><br>${esc(b.bookingDate||'—')}</div><div><b>المقر</b><br>${esc(b.venueName||'—')}</div>${b.eventId?`<div><b>رقم الفعالية</b><br><span class="id">${esc(b.eventId)}</span></div>`:''}</div><div class="actions"><button class="yes" onclick="setStatus('${esc(b.requestId)}','approved')">اعتماد</button><button class="warn" onclick="setStatus('${esc(b.requestId)}','needs_info')">طلب معلومات</button><button class="no" onclick="setStatus('${esc(b.requestId)}','rejected')">رفض</button></div></article>`).join('')}
async function refresh(){if(!I.getAdminKey()){render(I.getRequests());return}try{const rows=await I.fetchRemoteRequests();document.getElementById('apiState').innerHTML='<span class="ok">متصل بـ Supabase</span>';render(rows)}catch(e){document.getElementById('apiState').textContent='تعذر الاتصال أو مفتاح الإدارة غير صحيح';render(I.getRequests())}}
refresh();
</script></body></html>
