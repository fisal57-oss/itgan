<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلبات بوابة المستفيد | إتقان</title><style>body{font-family:system-ui,Tahoma;background:#f1f5f9;color:#0f172a;margin:0;padding:24px}.wrap{max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.card,.settings{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 8px 28px #0f172a0d}.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}button,a{border:0;border-radius:10px;padding:10px 14px;font-weight:700;text-decoration:none;cursor:pointer}.yes{background:#059669;color:#fff}.no{background:#dc2626;color:#fff}.info{background:#4f46e5;color:#fff}.warn{background:#d97706;color:#fff}input{padding:11px;border:1px solid #cbd5e1;border-radius:10px;min-width:280px}.badge{padding:5px 10px;border-radius:999px;font-weight:700}.pending{background:#fef3c7}.approved{background:#d1fae5}.rejected{background:#fee2e2}.needs_info{background:#ffedd5}.id{direction:ltr;display:inline-block;font-weight:800}</style></head><body><main class="wrap"><div class="top"><div><h1>طلبات بوابة المستفيد</h1><p>إدارة طلبات المسرح والقاعات وربطها بمسرحنا</p></div><a class="info" href="index.html">العودة لإتقان</a></div><section class="settings"><b>عنوان API المشترك</b><div class="actions"><input id="api" placeholder="https://your-domain.com/api/integration_requests.php"><button class="info" onclick="saveApi()">حفظ وربط</button><button onclick="refresh()">تحديث الطلبات</button></div><small>يُضبط مرة واحدة بعد رفع نسخة PHP على الاستضافة.</small></section><div id="list"></div></main><script src="booking-integration.js"></script><script>
const I=window.ITGAN_BOOKING_INTEGRATION;document.getElementById('api').value=I.getApiUrl();
function label(s){return({pending:'قيد المراجعة',approved:'معتمد',rejected:'مرفوض',needs_info:'مطلوب معلومات'})[s]||s}
function saveApi(){I.configureApi(document.getElementById('api').value);refresh()}
async function setStatus(id,status){try{const remote=await I.updateRemoteStatus(id,status);let rows=I.getRequests(),i=rows.findIndex(x=>x.requestId===id);if(i>=0){rows[i].status=status;if(remote&&remote.eventId)rows[i].eventId=remote.eventId;localStorage.setItem(I.inboxKey,JSON.stringify(rows))}render(rows)}catch(e){alert('تعذر تحديث الطلب على الخادم: '+e.message)}}
function render(rows){const el=document.getElementById('list');if(!rows.length){el.innerHTML='<section class="card">لا توجد طلبات واردة.</section>';return}el.innerHTML=rows.map(b=>`<article class="card"><div class="top"><h3>${b.eventTitle||'طلب حجز'}</h3><span class="badge ${b.status||'pending'}">${label(b.status||'pending')}</span></div><div class="meta"><div><b>رقم الطلب</b><br><span class="id">${b.requestId}</span></div><div><b>الجهة</b><br>${b.orgName||'—'}</div><div><b>المنسق</b><br>${b.contactName||'—'}</div><div><b>الجوال</b><br>${b.phone||'—'}</div><div><b>التاريخ</b><br>${b.bookingDate||'—'}</div><div><b>المقر</b><br>${b.venueName||'—'}</div>${b.eventId?`<div><b>رقم الفعالية</b><br><span class="id">${b.eventId}</span></div>`:''}</div><div class="actions"><button class="yes" onclick="setStatus('${b.requestId}','approved')">اعتماد</button><button class="warn" onclick="setStatus('${b.requestId}','needs_info')">طلب معلومات</button><button class="no" onclick="setStatus('${b.requestId}','rejected')">رفض</button></div></article>`).join('')}
async function refresh(){try{render(await I.fetchRemoteRequests())}catch(e){render(I.getRequests());alert('تعذر جلب المزامنة، تم عرض النسخة المحلية.') }}
refresh();
</script></body></html>
