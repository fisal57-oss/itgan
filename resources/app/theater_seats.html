<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>فتح نظام مسرحنا</title>
  <meta http-equiv="refresh" content="0;url=https://fisal57-oss.github.io/almasrah/" />
  <script>
    (function () {
      const target = new URL('https://fisal57-oss.github.io/almasrah/');
      const current = new URL(window.location.href);
      ['requestId', 'eventId', 'source'].forEach(function (key) {
        const value = current.searchParams.get(key);
        if (value) target.searchParams.set(key, value);
      });
      if (!target.searchParams.has('source')) target.searchParams.set('source', 'itgan');
      window.location.replace(target.toString());
    })();
  </script>
</head>
<body>
  <p>جارٍ فتح نظام مسرحنا…</p>
  <p><a href="https://fisal57-oss.github.io/almasrah/">فتح مسرحنا</a></p>
</body>
</html>
